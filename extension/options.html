<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>jev2mcp</title
  ><style>
    body {
      width: 310px;
      padding: 18px;
      color: #222;
      background: #fff;
      font:
        13px Arial,
        sans-serif;
    }
    h1 {
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 22px;
    }
    p {
      color: #777;
      line-height: 1.5;
    }
    a {
      color: #555;
    }
    label {
      display: block;
      margin: 16px 0;
      line-height: 1.5;
    }
    textarea {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      font: 12px monospace;
    }
    button {
      background: #222;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
    }
    input {
      accent-color: #222;
    }
    small {
      display: block;
      color: #888;
      font-size: 11px;
      line-height: 1.5;
    }
    #status {
      font-size: 12px;
    }
  </style>
  <h1>jev2mcp</h1>
  <label><input id="enabled" type="checkbox" /> Check tools before sending</label
  ><label><input id="context" type="checkbox" /> Include the last 4 chat messages</label>
  <details>
    <summary>Connection</summary>
    <p><a href="http://127.0.0.1:4328" target="_blank">Open local settings ↗</a></p>
    <label
      >Pairing package<textarea
        id="pair"
        rows="3"
        placeholder="Paste from local settings"
      ></textarea></label
    ><button id="save">Pair &amp; enable</button>
  </details>
  <p id="status" role="status"></p>
  <small>Prompts and optional context are sent to TypeSafe. No prompt history is saved.</small>
  <script src="options.js"></script>
</html>
